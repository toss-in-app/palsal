<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:318px;height:524px;overflow:hidden;background:#2272EB;-webkit-font-smoothing:antialiased}
body{position:relative;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;color:#fff}
.t{position:absolute;left:26px;top:42px;font-size:23px;line-height:1.32;font-weight:700;letter-spacing:-0.4px}
.s{position:absolute;left:26px;top:112px;right:22px;font-size:12.5px;line-height:1.45;font-weight:500;color:rgba(255,255,255,.9)}
.phone{position:absolute;left:24px;width:270px;top:152px;height:430px;background:#0f1729;border-radius:34px;padding:6px;box-shadow:0 12px 32px rgba(0,20,60,.28)}
.screen{width:100%;height:100%;border-radius:28px;overflow:hidden;background:#fff}
.screen img{display:block;width:100%}
</style></head><body>
<div class="t">{title}</div>
<div class="s">{sub}</div>
<div class="phone"><div class="screen"><img src="../raw/{raw}.png" alt=""></div></div>
</body></html>
